---
version: 2
updates:
  # one PR for every action that moved: actions published together must be bumped together
  # (codeql-action's init and analyze refuse to run on different versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # dependabot auto-detects the vendor/ directory and runs `go mod tidy` + `go mod vendor` on updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns:
          - "*"

  # dev tools (actionlint, golangci-lint, gofumpt) pinned in .tools/go.mod; tools move slowly,
  # so only check quarterly. a golangci-lint bump also needs .tools/.custom-gcl.yml's version
  # changed by hand to match — dependabot cannot see it, and depscheck fails until it is
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns:
          - "*"
